<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Canvas JS</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Tasks Vision -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --neon-cyan: #00e5ff;
            --neon-pink: #ff00ff;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 10, 15, 0.85);
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            
            /* Cyberpunk Grid Background */
            background-color: var(--dark-bg);
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, var(--dark-bg) 100%);
            z-index: -1;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 3rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
        }

        .main-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .cyber-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.1);
            position: relative;
            padding: 20px;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        }

        .cyber-panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 30px; height: 30px;
            background: var(--neon-cyan);
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        .video-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 1px solid var(--neon-cyan);
            background: #000;
        }
        
        video {
            display: none; /* We use canvas to draw the video */
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 640px;
            height: 480px;
            transform: scaleX(-1); /* Mirror */
        }

        #output_canvas { z-index: 1; } /* Video + landmarks */
        #drawing_canvas { z-index: 2; pointer-events: none; } /* User Drawing */
        #cursor_canvas { z-index: 3; pointer-events: none; } /* Neon cursor */

        .video-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }

        .stat-card {
            background: rgba(0, 229, 255, 0.05);
            border-left: 4px solid var(--neon-cyan);
            padding: 15px 20px;
            transition: all 0.2s;
        }
        
        .stat-card.active-tool {
            border-left-color: var(--neon-pink);
            background: rgba(255, 0, 255, 0.15);
        }

        .stat-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        
        .stat-value.active-gesture {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.2s;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        button:hover, button.active {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--neon-cyan);
        }

        input[type=color] {
            border: none;
            width: 50px;
            height: 50px;
            background: transparent;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>NEON_CANVAS_WEB</h1>
    
    <div id="loading" style="font-size: 1.5rem; color: var(--neon-pink); margin-bottom: 20px;">
        INITIALIZING NEURAL LINK (Loading AI Model)...
    </div>

    <div class="main-container" style="display: none;" id="main_ui">
        <div class="cyber-panel">
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas" width="640" height="480"></canvas>
                <canvas id="drawing_canvas" width="640" height="480"></canvas>
                <canvas id="cursor_canvas" width="640" height="480"></canvas>
            </div>
            
            <div class="controls">
                <button onclick="setTool('SOLID')" id="btn_SOLID" class="active">SOLID</button>
                <button onclick="setTool('ERASER')" id="btn_ERASER">ERASER</button>
                <button onclick="clearCanvas()">CLEAR</button>
            </div>
        </div>

        <div class="hud-sidebar cyber-panel">
            <div class="stat-card">
                <div class="stat-label">Sensor.Gesture</div>
                <div class="stat-value" id="val-gesture">IDLE</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Module.Tool</div>
                <div class="stat-value" id="val-tool">SOLID</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Module.Radius</div>
                <input type="range" id="brush_size" min="2" max="50" value="10" oninput="updateSize(this.value)">
                <div class="stat-value"><span id="val-size">10</span>px</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Output.Color</div>
                <div style="display: flex; align-items: center; margin-top: 8px;">
                    <input type="color" id="color_picker" value="#00e5ff" onchange="updateColor(this.value)">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById("webcam");
        const outCanvas = document.getElementById("output_canvas");
        const outCtx = outCanvas.getContext("2d");
        const drawCanvas = document.getElementById("drawing_canvas");
        const drawCtx = drawCanvas.getContext("2d");
        const cursorCanvas = document.getElementById("cursor_canvas");
        const cursorCtx = cursorCanvas.getContext("2d");
        
        let handLandmarker = undefined;
        let runningMode = "VIDEO";
        let lastVideoTime = -1;
        
        let activeTool = "SOLID";
        let brushSize = 10;
        let brushColor = "#00e5ff";
        
        let isDrawing = false;
        let lastPx = null;
        let lastPy = null;

        window.setTool = function(tool) {
            activeTool = tool;
            document.getElementById('val-tool').textContent = tool;
            document.getElementById('btn_SOLID').classList.remove('active');
            document.getElementById('btn_ERASER').classList.remove('active');
            document.getElementById('btn_' + tool).classList.add('active');
        };

        window.updateSize = function(val) {
            brushSize = parseInt(val);
            document.getElementById('val-size').textContent = brushSize;
        };
        
        window.updateColor = function(val) {
            brushColor = val;
        };
        
        window.clearCanvas = function() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        };

        // Initialize MediaPipe
        async function createHandLandmarker() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: runningMode,
                numHands: 1,
                minHandDetectionConfidence: 0.5,
                minHandPresenceConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            document.getElementById("loading").style.display = "none";
            document.getElementById("main_ui").style.display = "flex";
            startCamera();
        }
        createHandLandmarker();

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            });
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        async function predictWebcam() {
            outCtx.save();
            outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
            // Draw video to output canvas (it's mirrored via CSS)
            outCtx.drawImage(video, 0, 0, outCanvas.width, outCanvas.height);
            
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                const results = handLandmarker.detectForVideo(video, performance.now());
                
                let gestureStr = "IDLE";
                document.getElementById('val-gesture').classList.remove('active-gesture');
                
                if (results.landmarks && results.landmarks.length > 0) {
                    const landmarks = results.landmarks[0];
                    
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    
                    // Coordinates map to canvas width/height
                    const px = indexTip.x * outCanvas.width;
                    const py = indexTip.y * outCanvas.height;
                    
                    const dist = getDistance(indexTip, thumbTip);
                    const isPinching = dist < 0.05;
                    
                    // Draw Cursor
                    cursorCtx.beginPath();
                    cursorCtx.arc(px, py, brushSize, 0, 2 * Math.PI);
                    cursorCtx.strokeStyle = "#fff";
                    cursorCtx.lineWidth = 2;
                    cursorCtx.stroke();
                    
                    if (isPinching) {
                        gestureStr = "PINCH (DRAWING)";
                        document.getElementById('val-gesture').classList.add('active-gesture');
                        
                        cursorCtx.beginPath();
                        cursorCtx.arc(px, py, 6, 0, 2 * Math.PI);
                        cursorCtx.fillStyle = activeTool === "ERASER" ? "#fff" : brushColor;
                        cursorCtx.fill();
                        
                        if (!isDrawing) {
                            isDrawing = true;
                            lastPx = px;
                            lastPy = py;
                        }
                        
                        // Draw on layer
                        drawCtx.beginPath();
                        drawCtx.lineCap = "round";
                        drawCtx.lineJoin = "round";
                        drawCtx.lineWidth = brushSize * 2;
                        
                        if (activeTool === "ERASER") {
                            drawCtx.globalCompositeOperation = "destination-out";
                        } else {
                            drawCtx.globalCompositeOperation = "source-over";
                            drawCtx.strokeStyle = brushColor;
                        }
                        
                        drawCtx.moveTo(lastPx, lastPy);
                        drawCtx.lineTo(px, py);
                        drawCtx.stroke();
                        
                        lastPx = px;
                        lastPy = py;
                    } else {
                        isDrawing = false;
                        lastPx = null;
                        lastPy = null;
                        
                        cursorCtx.beginPath();
                        cursorCtx.arc(px, py, 3, 0, 2 * Math.PI);
                        cursorCtx.fillStyle = "#aaa";
                        cursorCtx.fill();
                    }
                } else {
                    isDrawing = false;
                    lastPx = null;
                    lastPy = null;
                }
                
                document.getElementById('val-gesture').textContent = gestureStr;
            }
            outCtx.restore();

            window.requestAnimationFrame(predictWebcam);
        }
    </script>
</body>
</html>
