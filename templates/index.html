<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Canvas</title>
    <!-- Import Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00e5ff;
            --neon-pink: #ff00ff;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 10, 15, 0.85);
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            
            /* Cyberpunk Grid Background */
            background-color: var(--dark-bg);
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            position: relative;
        }

        /* Overlay shadow to focus center */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, var(--dark-bg) 100%);
            z-index: -1;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 3rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan);
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; }
        }

        .main-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        /* Cyberpunk Panel */
        .cyber-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 
                0 0 15px rgba(0, 229, 255, 0.2),
                inset 0 0 20px rgba(0, 229, 255, 0.1);
            position: relative;
            padding: 20px;
            /* Angled corners using clip-path */
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
        }

        /* Glitch decorations */
        .cyber-panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 30px; height: 30px;
            background: var(--neon-cyan);
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        .video-container {
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
            position: relative;
        }

        .video-container img {
            display: block;
            width: 100%;
            height: auto;
            filter: contrast(1.1) brightness(0.9);
        }

        /* Scanline effect over video */
        .video-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* HTML HUD Layout */
        .hud-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }

        .stat-card {
            background: rgba(0, 229, 255, 0.05);
            border-left: 4px solid var(--neon-cyan);
            padding: 15px 20px;
            position: relative;
            transition: all 0.2s;
        }

        .stat-card:hover {
            background: rgba(0, 229, 255, 0.15);
            border-left-color: var(--neon-pink);
            box-shadow: 5px 0 15px rgba(255, 0, 255, 0.2);
            transform: translateX(5px);
        }

        .stat-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        
        .stat-value.active-gesture {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--neon-pink); }
            50% { text-shadow: 0 0 25px var(--neon-pink), 0 0 5px #fff; }
            100% { text-shadow: 0 0 10px var(--neon-pink); }
        }
        
        .color-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #fff;
            vertical-align: middle;
            margin-right: 15px;
            transform: rotate(45deg); /* Diamond shape */
        }

        /* Controls */
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 12px 25px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>NEON_CANVAS_V1</h1>
    
    <div class="main-container">
        <!-- Video Stream wrapped in Cyberpunk Panel -->
        <div class="cyber-panel" style="padding-bottom: 30px;">
            <div class="video-container">
                <img src="/video_feed" alt="SYS.STREAM_OFFLINE">
            </div>
            
            <div class="controls">
                <button onclick="sendCommand('/toggle_camera')">SYS.TOGGLE_BG</button>
                <button onclick="sendCommand('/clear_canvas')">SYS.WIPE_MEM</button>
                <button onclick="sendCommand('/switch_camera')">SYS.SWITCH_CAM</button>
            </div>
        </div>

        <!-- HTML HUD Sidebar -->
        <div class="hud-sidebar cyber-panel">
            <div class="stat-card">
                <div class="stat-label">Sensor.Gesture</div>
                <div class="stat-value" id="val-gesture">IDLE</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Module.Tool</div>
                <div class="stat-value" id="val-tool">SOLID</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Module.Radius</div>
                <div class="stat-value"><span id="val-size">10</span>px</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Output.Color</div>
                <div style="display: flex; align-items: center; margin-top: 8px;">
                    <div class="color-preview" id="val-color"></div>
                    <div class="stat-value" style="font-size: 1.2rem; font-family: 'Outfit', sans-serif;" id="val-color-text">RGB</div>
                </div>
            </div>
            
            <div class="stat-card" style="border:none; border-top: 1px dashed rgba(0,229,255,0.3); padding-top:20px; background:transparent;">
                <div class="stat-label">Hardware.Node</div>
                <div class="stat-value" style="font-size: 1rem; color:#666;" id="val-cam">INDEX 0</div>
            </div>
        </div>
    </div>

    <script>
        function sendCommand(endpoint) {
            fetch(endpoint, { method: 'POST' })
            .catch(error => console.error('Error:', error));
        }

        setInterval(() => {
            fetch('/state')
                .then(res => res.json())
                .then(data => {
                    const gestureEl = document.getElementById('val-gesture');
                    gestureEl.textContent = data.gesture;
                    if(data.gesture === "PINCH" || data.gesture === "POINTING") {
                        gestureEl.classList.add("active-gesture");
                    } else {
                        gestureEl.classList.remove("active-gesture");
                    }

                    document.getElementById('val-tool').textContent = data.tool;
                    document.getElementById('val-size').textContent = data.size;

                    const b = data.color[0];
                    const g = data.color[1];
                    const r = data.color[2];
                    const colorStr = `rgb(${r}, ${g}, ${b})`;
                    document.getElementById('val-color').style.backgroundColor = colorStr;
                    document.getElementById('val-color').style.boxShadow = `0 0 15px ${colorStr}`;
                    document.getElementById('val-color-text').textContent = `${r}, ${g}, ${b}`;

                    document.getElementById('val-cam').textContent = "INDEX " + data.cam_index;
                })
                .catch(err => console.error(err));
        }, 100); 
    </script>

</body>
</html>
